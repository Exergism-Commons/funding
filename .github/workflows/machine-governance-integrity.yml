name: Machine-readable funding governance

on:
  push:
    paths:
      - "data/opportunities.yaml"
      - "knowledge/**"
      - "ontology/**"
      - "spec/MACHINE-READABLE-GOVERNANCE.md"
      - "strategy/**"
      - "requirements-ontology.txt"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/machine-governance-integrity.yml"
  pull_request:
    paths:
      - "data/opportunities.yaml"
      - "knowledge/**"
      - "ontology/**"
      - "spec/MACHINE-READABLE-GOVERNANCE.md"
      - "strategy/**"
      - "requirements-ontology.txt"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/machine-governance-integrity.yml"

permissions:
  contents: read

jobs:
  semantic-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ontology.txt

      - name: Install RDF and SHACL tooling
        run: python -m pip install -r requirements-ontology.txt

      - name: Establish trusted history boundary
        shell: bash
        env:
          EC_FUNDING_PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "EC_FUNDING_HISTORY_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          else
            echo "EC_FUNDING_HISTORY_BASE=${EC_FUNDING_PUSH_BASE}" >> "$GITHUB_ENV"
          fi

      - name: Enforce persistent record and opportunity history
        run: python tools/validate_persistent_history.py

      - name: Enforce canonical review deadlines
        run: python tools/validate_temporal_governance.py

      - name: Verify canonical evidence bindings
        run: python tools/validate_evidence_bindings.py

      - name: Verify mutable context matches frozen 0.2.0-pre1 context
        run: cmp ontology/funding-context.jsonld ontology/contexts/funding-context-0.2.0-pre1.jsonld

      - name: Run funding governance integrity suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Parse canonical semantic artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph

          json.load(open('ontology/funding-context.jsonld', encoding='utf-8'))
          json.load(open('ontology/contexts/funding-context-0.1.0-draft.jsonld', encoding='utf-8'))
          json.load(open('ontology/contexts/funding-context-0.2.0-pre1.jsonld', encoding='utf-8'))
          for path in (
              'ontology/funding.owl.ttl',
              'ontology/funding.shacl.ttl',
              'ontology/funding-authority.shacl.ttl',
              'ontology/dependencies/commons.ttl',
              'ontology/dependencies/governance.ttl',
              'ontology/dependencies/governance-shapes.ttl',
          ):
              graph = Graph().parse(path, format='turtle')
              print(f'parsed {path}: {len(graph)} triples')

          records = sorted(Path('knowledge').rglob('*.jsonld'))
          assert records, 'no canonical governance records found'
          for path in records:
              Graph().parse(path, format='json-ld')
          print(f'parsed {len(records)} canonical/historical JSON-LD records')
          PY

      - name: Build derived governance graph twice
        run: |
          python tools/build_governance_graph.py --output-dir build-a
          python tools/build_governance_graph.py --output-dir build-b

      - name: Assert deterministic derived graph
        run: |
          cmp build-a/funding-governance.nt build-b/funding-governance.nt
          cmp build-a/funding-governance-build.json build-b/funding-governance-build.json

      - name: Validate live graph with composed SHACL and authority profiles
        run: |
          python - <<'PY'
          from rdflib import Graph
          from pyshacl import validate

          data = Graph().parse('build-a/funding-governance.ttl', format='turtle')
          for path in (
              'ontology/dependencies/commons.ttl',
              'ontology/dependencies/governance.ttl',
              'ontology/funding.owl.ttl',
          ):
              data.parse(path, format='turtle')

          shapes = Graph().parse('ontology/funding.shacl.ttl', format='turtle')
          shapes.parse('ontology/funding-authority.shacl.ttl', format='turtle')
          shapes.parse('ontology/dependencies/governance-shapes.ttl', format='turtle')

          conforms, _, report = validate(
              data,
              shacl_graph=shapes,
              inference='none',
              advanced=True,
              abort_on_first=False,
              allow_infos=False,
              allow_warnings=False,
          )
          if not conforms:
              raise SystemExit(report)
          print('composed Funding + Governance + authority SHACL profile conforms')
          PY
