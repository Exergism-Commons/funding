name: Machine-readable funding governance

on:
  push:
    paths:
      - "data/opportunities.yaml"
      - "knowledge/**"
      - "ontology/**"
      - "spec/MACHINE-READABLE-GOVERNANCE.md"
      - "strategy/**"
      - "requirements-ontology.txt"
      - "tools/build_governance_graph.py"
      - "tests/**"
      - ".github/workflows/machine-governance-integrity.yml"
  pull_request:
    paths:
      - "data/opportunities.yaml"
      - "knowledge/**"
      - "ontology/**"
      - "spec/MACHINE-READABLE-GOVERNANCE.md"
      - "strategy/**"
      - "requirements-ontology.txt"
      - "tools/build_governance_graph.py"
      - "tests/**"
      - ".github/workflows/machine-governance-integrity.yml"

permissions:
  contents: read

jobs:
  semantic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ontology.txt

      - name: Install RDF and SHACL tooling
        run: python -m pip install -r requirements-ontology.txt

      - name: Run funding governance integrity suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Parse canonical semantic artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph

          json.load(open('ontology/funding-context.jsonld', encoding='utf-8'))
          for path in (
              'ontology/funding.owl.ttl',
              'ontology/funding.shacl.ttl',
              'ontology/dependencies/commons.ttl',
              'ontology/dependencies/governance.ttl',
              'ontology/dependencies/governance-shapes.ttl',
          ):
              graph = Graph().parse(path, format='turtle')
              print(f'parsed {path}: {len(graph)} triples')

          records = sorted(Path('knowledge').rglob('*.jsonld'))
          assert records, 'no canonical governance records found'
          graph = Graph()
          for path in records:
              graph.parse(path, format='json-ld')
          print(f'parsed {len(records)} canonical JSON-LD records into {len(graph)} triples')
          PY

      - name: Build derived governance graph twice
        run: |
          python tools/build_governance_graph.py --output-dir build-a
          python tools/build_governance_graph.py --output-dir build-b

      - name: Assert deterministic derived graph
        run: |
          cmp build-a/funding-governance.nt build-b/funding-governance.nt
          cmp build-a/funding-governance-build.json build-b/funding-governance-build.json

      - name: Validate live graph with composed SHACL profile
        run: |
          python - <<'PY'
          from rdflib import Graph
          from pyshacl import validate

          data = Graph().parse('build-a/funding-governance.ttl', format='turtle')
          for path in (
              'ontology/dependencies/commons.ttl',
              'ontology/dependencies/governance.ttl',
              'ontology/funding.owl.ttl',
          ):
              data.parse(path, format='turtle')

          shapes = Graph().parse('ontology/funding.shacl.ttl', format='turtle')
          shapes.parse('ontology/dependencies/governance-shapes.ttl', format='turtle')

          conforms, _, report = validate(
              data,
              shacl_graph=shapes,
              inference='none',
              advanced=True,
              abort_on_first=False,
              allow_infos=False,
              allow_warnings=False,
          )
          if not conforms:
              raise SystemExit(report)
          print('composed Funding + Governance SHACL profile conforms')
          PY
