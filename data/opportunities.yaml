schema_version: 2
updated: 2026-09-04
currency_default: EUR

scoring:
  scale: "0.0-1.0"
  required_dimensions:
    - fit
    - funding_value
    - capability_value
    - strategic_optionality
    - autonomy_value
    - network_value
    - recurrence
    - capture_risk
    - admin_cost
    - execution_risk
  semantics:
    positive: "Higher is better: fit, funding_value, capability_value, strategic_optionality, autonomy_value, network_value, recurrence."
    negative: "Higher is worse: capture_risk, admin_cost, execution_risk."
  missing_value_policy: "No implicit defaults. A missing required dimension makes an opportunity ineligible for automated EIV ranking until explicitly scored."

